<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gema Aethelgard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <!-- Memuat Phaser.js dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>

    <!-- Memuat file scene -->
    <script src="MapScene.js"></script>
    <script src="GameScene.js"></script>
    <script src="WifiScene.js"></script>
    <script src="PipeScene.js"></script>
    <script src="DopplerScene.js"></script>
    
    <script>
        window.onload = function() {
            const config = {
                type: Phaser.AUTO,
                width: 1280,
                height: 720,
                parent: 'game-container',
                scale: {
                    mode: Phaser.Scale.FIT, // Menyesuaikan layar HP secara proporsional[cite: 3]
                    autoCenter: Phaser.Scale.CENTER_BOTH
                },
                physics: { 
                    default: 'arcade', 
                    arcade: { debug: false } 
                },
                scene: [MapScene, GameScene, WifiScene, PipeScene, DopplerScene] 
            };
            const game = new Phaser.Game(config);
        }
    </script>
</body>
</html>
